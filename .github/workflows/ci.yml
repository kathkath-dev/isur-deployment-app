name: CI ISUR Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t isur-deployment-app .

      - name: Validar Docker Compose
        run: docker compose config

      - name: Levantar servicios
        run: docker compose up -d

      - name: Comprobar aplicacion web
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent \
              http://localhost:8081 > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verificar contenedores
        run: docker compose ps

      - name: Detener servicios
        if: always()
        run: docker compose down -v